# Name of your application. Used to uniquely configure containers.
service: mvp_facebook_developers

# Container image — use <your-dockerhub-username>/mvp_facebook_developers
image: sleepyle0/mvp_facebook_developers

# Deploy to these servers (your VM's public IP).
servers:
  web:
    - <%= ENV.fetch("DEPLOY_IP") %>

# SSL via Let's Encrypt, terminated by kamal-proxy. Point your domain's DNS
# A record at YOUR_VM_IP first. Requires config.assume_ssl + config.force_ssl
# in production.rb (already enabled).
proxy:
  ssl: true
  host: army.klangtech.com

# Where your image is stored. Docker Hub shown; ghcr.io etc. also work.
registry:
  server: docker.io
  username: sleepyle0
  password:
    - KAMAL_REGISTRY_PASSWORD

# ENV injected into the container. Secrets resolve from .kamal/secrets.
env:
  clear:
    SOLID_QUEUE_IN_PUMA: true
    GRAPH_API_VERSION: v20.0
  secret:
    - RAILS_MASTER_KEY
    - FB_APP_ID
    - FB_APP_SECRET
    - FB_VERIFY_TOKEN
    - FB_PAGE_ACCESS_TOKEN

# bin/kamal <alias>
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent volume for the SQLite database + Active Storage files.
# This is what keeps your data across deploys — back it up off-server.
volumes:
  - "mvp_facebook_developers_storage:/rails/storage"

asset_path: /rails/public/assets

# Build an amd64 image (most VMs are amd64). If your Mac is Apple Silicon,
# the build cross-compiles; add a `remote:` builder if it's slow.
builder:
  arch: amd64

# Connect to the VM as the scm user with its dedicated key.
# scm must be able to run docker (in the docker group) and have passwordless
# sudo for the one-time Docker install during `kamal setup`.
ssh:
  user: scm
  keys:
    - ~/.ssh/id_scm
